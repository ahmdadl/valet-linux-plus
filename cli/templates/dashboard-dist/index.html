    <title>Valet Dashboard</title>
    <script>
      // Paint the stored theme before first paint so there is no flash.
      // The dashboard honours the OS preference by default (same as the old
      // vanilla page) and only overrides it when the user picked a side.
      (function () {
        try {
          var stored = localStorage.getItem('valet-dashboard-theme');
          var dark =
            stored === 'dark' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private mode: fall back to the OS preference */
        }
      })();
    </script>
