name: CI

on: [push, pull_request]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Matrix covers minimal (8.2) to latest supported PHP versions
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y network-manager libnss3-tools jq xsel
          composer install --no-interaction --prefer-dist
      - name: Test
        run: composer test
  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHPStan
        run: composer stan -- --error-format=github
      - name: Audit dependencies
        run: composer audit
  cs_fixer:
    name: CS Fixer
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - 8.3
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y network-manager libnss3-tools jq xsel
          composer install --no-interaction --prefer-dist
      - name: CS Fixer
        run: composer cs:check
